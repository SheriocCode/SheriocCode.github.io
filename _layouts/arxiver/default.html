<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" href="{{ '/arxiver/assets/img/icon128.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/arxiver/assets/style.css' | relative_url }}">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-name">Zhang Jie</span></a>
    <nav class="site-nav" id="site-nav">
      <a href="{{ '/' | relative_url }}"{% if page.nav == 'home' %} class="active"{% endif %}>首页</a>
      <a href="{{ '/cv/' | relative_url }}"{% if page.nav == 'cv' %} class="active"{% endif %}>简历</a>
      <a href="{{ '/publications/' | relative_url }}"{% if page.nav == 'publications' %} class="active"{% endif %}>论文</a>
      <a href="{{ '/arxiver/' | relative_url }}"{% if page.group == 'arxiver' %} class="active"{% endif %}>Arxiver</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.nav == 'blog' %} class="active"{% endif %}>随笔</a>
    </nav>
    <a class="btn primary nav-download" href="https://github.com/SheriocCode" target="_blank" rel="noopener">GitHub</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="展开导航">
      <span>菜单</span><b class="nav-toggle-mark"></b>
    </button>
  </div>
</header>

{% if page.group == 'arxiver' %}
<nav class="project-nav" aria-label="Arxiver 文档导航">
  <div class="container">
    <a href="{{ '/arxiver/' | relative_url }}"{% if page.nav == 'overview' %} class="active"{% endif %}>概览</a>
    <a href="{{ '/arxiver/guide.html' | relative_url }}"{% if page.nav == 'guide' %} class="active"{% endif %}>文档</a>
    <a href="{{ '/arxiver/reference.html' | relative_url }}"{% if page.nav == 'reference' %} class="active"{% endif %}>参考</a>
    <a href="{{ '/arxiver/changelog.html' | relative_url }}"{% if page.nav == 'changelog' %} class="active"{% endif %}>更新日志</a>
    <a href="https://github.com/SheriocCode/Arxiver" target="_blank" rel="noopener">GitHub</a>
  </div>
</nav>
{% endif %}

<main>
{{ content }}
</main>

<footer class="site-footer">
  <div class="container">
    <div>©2026 Zhang Jie · 武汉理工大学</div>
    <div>
      <a href="https://github.com/SheriocCode" target="_blank" rel="noopener">GitHub</a> ·
      <a href="{{ '/cv/' | relative_url }}">简历</a> ·
      <a href="{{ '/publications/' | relative_url }}">论文</a> ·
      <a href="{{ '/blog/' | relative_url }}">随笔</a>
    </div>
  </div>
</footer>

<script src="{{ '/arxiver/assets/carousel.js' | relative_url }}" defer></script>
<script src="{{ '/arxiver/assets/nav.js' | relative_url }}" defer></script>

</body>
</html>
